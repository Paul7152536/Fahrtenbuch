name: Fahrtenbuch APK bauen

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Neueste Projekt-ZIP entpacken
        run: |
          ZIP=$(ls Fahrtenbuch-v*.zip | sort -V | tail -1)
          echo "Baue aus: $ZIP"
          unzip -o "$ZIP" -d .
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK bauen
        run: gradle assembleRelease

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Fahrtenbuch-APK
          path: app/build/outputs/apk/release/app-release.apk
